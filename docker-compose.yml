version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nfl_postgres
    environment:
      POSTGRES_DB: nfl_assistant
      POSTGRES_USER: nfl_user
      POSTGRES_PASSWORD: nfl_secure_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    networks:
      - nfl_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfl_user -d nfl_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NFL Assistant Web Application
  nfl_app:
    build: .
    container_name: nfl_assistant_app
    environment:
      # Database configuration
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: nfl_assistant
      POSTGRES_USER: nfl_user
      POSTGRES_PASSWORD: nfl_secure_password_2024
      
      # Flask configuration
      FLASK_ENV: production
      FLASK_APP: app.py
      PORT: 5000
      
      # Application settings
      NFL_CACHE_DURATION: 21600  # 6 hours
      NFL_MAX_RANKINGS: 50
      NFL_API_TIMEOUT: 30
    ports:
      - "5000:5000"
    volumes:
      - ./data_cache:/app/data_cache
      - ./logs:/app/logs
      - ./models:/app/models
    networks:
      - nfl_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: nfl_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nfl_network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: nfl_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    networks:
      - nfl_network
    depends_on:
      - nfl_app
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  nfl_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16