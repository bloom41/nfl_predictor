services:
  postgres:
    image: postgres:15-alpine
    container_name: nfl_postgres_only
    environment:
      POSTGRES_DB: nfl_assistant
      POSTGRES_USER: nfl_user
      POSTGRES_PASSWORD: nfl_secure_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfl_user -d nfl_assistant"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local